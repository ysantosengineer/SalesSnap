[project]
name = "sales-snap-api"
version = "0.1.0"
description = "SalesSnap API foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "openai>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "pandas>=2.2,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "scikit-learn>=1.6,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "pyjwt>=2.15,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "email-validator>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "pip-audit>=2.10,<3.0",
  "pytest>=9.0.3,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["postgres: requires POSTGRES_TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
